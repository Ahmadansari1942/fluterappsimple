version: 1
frontend:
  phases:
    preBuild:
      commands:
        - git clone https://github.com -b stable --depth 1
        - export PATH="$PATH:$PWD/flutter/bin"
        - flutter doctor
        - flutter pub get
        
    build:
      commands:
        - export PATH="$PATH:$PWD/flutter/bin"
        - flutter build web --release --base-href /
        
  artifacts:
    baseDirectory: build/web
    files:
      - '**/*'
